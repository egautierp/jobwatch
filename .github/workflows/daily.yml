name: Daily job scan

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC, 7am in London during summer time
  workflow_dispatch:       # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Scan careers pages
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python -m jobwatch.run
      - name: Save results
        run: |
          git config user.name "jobwatch"
          git config user.email "jobwatch@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Daily scan $(date -u +%F)"
          git push
