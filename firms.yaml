# Which roles to keep. Matching is case-insensitive and matches at the start of
# a word, so "acquisition" also catches "Acquisitions". Words of 3 letters or
# fewer must match exactly (so "btr" will not match inside other words).
filters:
  role_keywords:
    - asset manag
    - portfolio manag
    - investment
    - acquisition
    - transaction
    - capital markets
    - fund manag
    - underwrit
    - origination
    - investor relations
    - real estate
    - residential
    - living
    - btr
    - pbsa
    - sfr
    - senior housing
    - senior living
    - property
  exclude_keywords:
    - intern
    - internship
    - summer
    - graduate
    - apprentice
    - receptionist
    - concierge
    - leasing consultant
    - leasing agent
    - lettings
    - maintenance
    - technician
    - porter
    - cleaner
    - housekeep
    - community
    - resident
    - front of house
    - chef
    - carer
    - care assistant
    - nurse
    - driver
    - security
    - software
    - engineer
    - accountant
    - payroll
    - tax
    - paralegal
    - recruit
    - facilities
  # Roles whose title or location names one of these places are dropped,
  # unless London is also mentioned. Adverts often give no location field, so
  # this catches "Associate, Singapore" and similar.
  exclude_places:
    - asia
    - apac
    - asia pacific
    - hong kong
    - singapore
    - tokyo
    - japan
    - seoul
    - korea
    - shanghai
    - beijing
    - china
    - mumbai
    - india
    - bangalore
    - sydney
    - melbourne
    - australia
    - dubai
    - abu dhabi
    - riyadh
    - middle east
    - americas
    - north america
    - united states
    - usa
    - new york
    - chicago
    - dallas
    - atlanta
    - boston
    - los angeles
    - san francisco
    - denver
    - miami
    - toronto
    - canada
    - latin america
    - brazil
    - mexico
  # Only for firms marked broad: true (multi-asset managers with thousands of
  # jobs). The title or department must also contain one of these.
  sector_keywords:
    - real estate
    - property
    - residential
    - living
    - housing
    - brep
    - bxre
    - re
  # A role with a listed location must match one of these. Roles without a
  # location are always kept.
  locations:
    - london
  # Roles whose title or department mentions any of these get a Europe tag on
  # the page. Set europe_only to true to keep only those roles.
  europe_only: false
  europe_keywords:
    - europe
    - emea
    - continental
    - cross-border
    - international
    - benelux
    - dach
    - nordic
    - iberia
    - germany
    - german
    - france
    - french
    - spain
    - spanish
    - italy
    - italian
    - netherlands
    - dutch
    - sweden
    - swedish
    - denmark
    - danish
    - finland
    - norway
    - poland
    - ireland
  tracks:
    asset_management: [asset manag, portfolio manag, asset manager]
    investments: [investment, acquisition, transaction, capital markets, underwrit, origination, fund manag]

# LinkedIn job alerts. Set up alerts on LinkedIn (Jobs, search, then turn on
# "Set alert") and have them emailed to the Gmail account in SMTP_USER. Each
# run reads the last few days of alert emails. Uses the same app password as
# the daily email. Role keywords are not applied, since your alert searches
# already choose the roles; exclusions and locations still are.
linkedin_alerts:
  enabled: true
  days: 3

# Contact details. For each new role, the advert is opened once to look for a
# named contact, email and phone. Recruiter adverts usually have one; firm
# adverts rarely do.
contacts:
  enabled: true
  max_per_run: 80

# Recruiter job pages. Adverts usually hide the client's name, so these show
# on the page marked as recruiter roles. Same options as firms below.
recruiters:
  - {name: Madison Berkeley, careers_url: "https://www.madisonberkeley.com/jobs"}
  - {name: Macdonald & Company, careers_url: "https://www.macdonaldandcompany.com/jobs"}
  - {name: Cobalt Recruitment, careers_url: "https://www.cobaltrecruitment.co.uk/jobs", broad: true}
  - {name: Selby Jennings, careers_url: "https://www.selbyjennings.com/en-us/jobs/s-investment-management/lt-london", broad: true}

# Each firm needs a name and careers_url. Optional:
